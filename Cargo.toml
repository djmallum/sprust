[package]
name = "sprust"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Rust tools for calculations using the Navier-Stokes Equation solver, SPINS, outputs."

[dependencies]
configparser = { version = "3.3.0" }
memmap2 = "0.9.12"
ndarray = "0.17.2"
bytemuck = "1.25.2"
clap = { version = "4.6.8", features = ["derive"] }
tempfile = "3.27.0"

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
